<div class="post-update-wrap">
  <div class="post-update-badge">
    <svg class="update-icon" width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
      <circle cx="12" cy="12" r="10"></circle>
      <polyline points="12 6 12 12 16 14"></polyline>
    </svg>
    <span>最終更新：<strong class="update-date">{{ page.last_modified_at | default: page.date | date: "%Y年%-m月%-d日" }}</strong></span>
  </div>
</div>
